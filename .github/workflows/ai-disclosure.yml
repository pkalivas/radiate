name: ai-disclosure

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const LABEL = 'needs-ai-disclosure';
            const MARKER = '<!-- ai-disclosure-bot -->';

            if (pr.user.type === 'Bot') return;
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association)) return;

            const body = pr.body || '';
            const ticked = (text) => new RegExp(`^\\s*[-*]\\s*\\[[xX]\\]\\s*${text}`, 'm').test(body);
            // Using AI only counts as disclosed once the author also attests to reviewing every change.
            const disclosed = ticked('I did not use AI tools')
              || (ticked('I used AI tools') && ticked('I have reviewed every change myself'));
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number };
            const hasLabel = pr.labels.some(l => l.name === LABEL);

            if (disclosed) {
              if (hasLabel) {
                await github.rest.issues.removeLabel({ ...issue, name: LABEL });
              }
              return;
            }

            if (!hasLabel) {
              await github.rest.issues.addLabels({ ...issue, labels: [LABEL] });
            }

            const comments = await github.paginate(github.rest.issues.listComments, issue);
            if (comments.some(c => c.body && c.body.includes(MARKER))) return;

            await github.rest.issues.createComment({
              ...issue,
              body: [
                MARKER,
                'Thanks for the PR! It looks like the **AI disclosure** section of the PR template has not been filled in.',
                '',
                'Please edit the description and tick one of the boxes. If you used AI tools, you must also tick ',
                `"I have reviewed every change myself..." (see [AI_POLICY.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/master/AI_POLICY.md)).`,
                'This label will be removed automatically once it is filled in.',
              ].join('\n'),
            });
