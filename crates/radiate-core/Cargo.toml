[package]
name = "radiate-core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Core traits and interfaces for the Radiate genetic algorithm library."
repository = { workspace = true }
readme = "../../README.md"
categories = { workspace = true }
keywords = ["simulation", "genetic", "learning", "artificial", "evolution"]
license = { workspace = true }
homepage = { workspace = true }

[dependencies]
radiate-error = { workspace = true }
radiate-utils = { workspace = true, default-features = false }
radiate-expr = { workspace = true, default-features = false }
num-traits = { workspace = true }
rand = { workspace = true }
smallvec = { workspace = true }
serde = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
crossbeam = { workspace = true }
rustc-hash = { workspace = true }
quanta = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
serde = ["dep:serde", "radiate-utils/serde", "radiate-expr/serde"]
rayon = ["dep:rayon"]
